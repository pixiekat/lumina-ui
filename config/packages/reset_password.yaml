symfonycasts_reset_password:
    # The helpers bundle now ships a reusable ResetPasswordRequest entity and
    # repository, so there is no App\Repository\ResetPasswordRequestRepository
    # to point at and no per-project entity to re-create.
    #
    # This used to read `symfonycasts.reset_password.fake_request_repository`,
    # the placeholder the recipe installs — with that in place the whole reset
    # flow silently no-ops: tokens are generated and then thrown away, so the
    # emailed link never validates.
    request_password_repository: Pixiekat\SymfonyHelpers\Repository\ResetPasswordRequestRepository
